version: 2

models:

  - name: dim_customers

    columns:

      - name: customer_key
        tests:
          - unique
          - not_null

      - name: customer_id
        tests:
          - not_null

  - name: dim_products

    columns:

      - name: product_key
        tests:
          - unique
          - not_null

      - name: product_id
        tests:
          - not_null

  - name: dim_date

    columns:

      - name: date_key
        tests:
          - unique
          - not_null

      - name: date_day
        tests:
          - unique
          - not_null

  - name: dim_payments

    columns:

      - name: payment_key
        tests:
          - unique
          - not_null

      - name: payment_type
        tests:
          - not_null

  - name: fact_orders

    columns:

      - name: customer_key
        tests:
          - not_null

      - name: product_key
        tests:
          - not_null

      - name: date_key
        tests:
          - not_null

      - name: payment_key
        tests:
          - not_null

      - name: order_id
        tests:
          - not_null